<!DOCTYPE html>
<html lang="vi">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>HC Plan 2027 – Bài Kiểm Tra Trắc Nghiệm</title>
<style>
  *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

  :root {
    --navy:   #003087;
    --navy2:  #1A4A9F;
    --blue:   #1A99D6;
    --green:  #1a7f37;
    --green-bg: #d1fae5;
    --green-bd: #34d399;
    --red:    #b91c1c;
    --red-bg: #fee2e2;
    --red-bd: #f87171;
    --gray:   #64748b;
    --light:  #f1f5f9;
    --border: #e2e8f0;
    --white:  #ffffff;
    --text:   #1e293b;
  }

  body {
    font-family: 'Segoe UI', Arial, sans-serif;
    background: #f0f4fb;
    color: var(--text);
    min-height: 100vh;
  }

  /* HEADER */
  .header {
    background: linear-gradient(135deg, var(--navy) 0%, var(--navy2) 100%);
    padding: 0 24px;
    display: flex; align-items: center; justify-content: space-between;
    height: 56px;
    position: sticky; top: 0; z-index: 100;
    box-shadow: 0 2px 8px rgba(0,0,0,.25);
  }
  .header-left { display: flex; flex-direction: column; }
  .header-brand { color: #fff; font-weight: 800; font-size: 16px; letter-spacing: -.3px; }
  .header-sub   { color: rgba(255,255,255,.65); font-size: 10px; letter-spacing: .6px; text-transform: uppercase; }
  .header-score { color: rgba(255,255,255,.9); font-size: 13px; font-weight: 600; }

  /* PROGRESS */
  .progress-wrap { background: #dbeafe; height: 5px; }
  .progress-bar  { height: 100%; background: linear-gradient(90deg, var(--blue), #60a5fa);
                   transition: width .4s ease; border-radius: 0 3px 3px 0; }

  /* DOT NAV */
  .dot-nav {
    display: flex; flex-wrap: wrap; gap: 5px;
    padding: 10px 20px; justify-content: center; max-width: 760px; margin: 0 auto;
  }
  .dot {
    width: 28px; height: 28px; border-radius: 50%;
    display: flex; align-items: center; justify-content: center;
    font-size: 10px; font-weight: 700; cursor: pointer;
    border: 2px solid transparent; transition: all .2s;
    background: var(--border); color: var(--gray);
  }
  .dot.active   { background: var(--blue);  color: #fff; border-color: var(--navy); }
  .dot.correct  { background: var(--green-bd); color: #fff; }
  .dot.wrong    { background: var(--red-bd);   color: #fff; }
  .dot.answered { opacity: .85; }

  /* MAIN CARD */
  .main { max-width: 760px; margin: 0 auto; padding: 0 16px 60px; }

  .card {
    background: var(--white);
    border-radius: 16px;
    padding: 28px 28px 24px;
    box-shadow: 0 4px 24px rgba(0,48,135,.08);
    border: 1px solid var(--border);
    margin-bottom: 16px;
  }

  .q-tag {
    display: inline-block;
    background: #eff6ff; color: var(--navy);
    font-weight: 700; font-size: 11px;
    padding: 3px 12px; border-radius: 20px;
    margin-bottom: 12px; text-transform: uppercase; letter-spacing: .7px;
  }

  .q-text {
    font-size: 16px; font-weight: 700; color: var(--text);
    line-height: 1.55; margin-bottom: 20px; white-space: pre-wrap;
  }

  /* OPTIONS */
  .options { display: flex; flex-direction: column; gap: 10px; }

  .opt-btn {
    display: flex; align-items: flex-start; gap: 12px;
    padding: 13px 16px;
    border-radius: 10px;
    border: 2px solid var(--border);
    background: var(--white);
    cursor: pointer; text-align: left; width: 100%;
    transition: all .18s; font-family: inherit;
  }
  .opt-btn:hover:not(:disabled) {
    border-color: var(--blue); background: #eff6ff;
  }
  .opt-btn.selected { border-color: var(--blue); background: #eff6ff; }
  .opt-btn.correct  { border-color: var(--green-bd); background: var(--green-bg); }
  .opt-btn.wrong    { border-color: var(--red-bd);   background: var(--red-bg); }
  .opt-btn:disabled { cursor: default; }

  .opt-circle {
    min-width: 26px; height: 26px; border-radius: 50%;
    display: flex; align-items: center; justify-content: center;
    font-size: 12px; font-weight: 700; flex-shrink: 0;
    background: var(--light); color: var(--gray);
    transition: all .18s;
  }
  .opt-btn.correct .opt-circle { background: var(--green); color: #fff; }
  .opt-btn.wrong   .opt-circle { background: var(--red);   color: #fff; }
  .opt-btn.selected:not(.correct):not(.wrong) .opt-circle {
    background: var(--blue); color: #fff;
  }

  .opt-text {
    font-size: 14px; line-height: 1.55; color: var(--text);
  }
  .opt-btn.correct .opt-text { color: var(--green); font-weight: 600; }
  .opt-btn.wrong   .opt-text { color: var(--red);   font-weight: 600; }

  /* FEEDBACK BOX */
  .feedback {
    margin-top: 16px; padding: 14px 16px;
    border-radius: 10px; display: none;
  }
  .feedback.show { display: block; }
  .feedback.ok  { background: #f0fdf4; border: 1.5px solid var(--green-bd); }
  .feedback.err { background: #fff7ed; border: 1.5px solid #fbbf24; }
  .feedback-title { font-weight: 700; font-size: 13px; margin-bottom: 4px;
                    display: flex; align-items: center; gap: 6px; }
  .feedback.ok  .feedback-title { color: var(--green); }
  .feedback.err .feedback-title { color: #92400e; }
  .feedback-body { font-size: 13px; color: #374151; line-height: 1.6; }

  /* ACTIONS */
  .actions {
    display: flex; justify-content: space-between; align-items: center;
    margin-top: 20px; gap: 12px;
  }
  .btn-primary {
    background: var(--navy); color: #fff;
    border: none; border-radius: 10px;
    padding: 12px 24px; font-size: 14px; font-weight: 700;
    cursor: pointer; font-family: inherit; transition: background .2s;
  }
  .btn-primary:hover { background: var(--navy2); }
  .btn-primary:disabled { opacity: .4; cursor: not-allowed; }
  .btn-secondary {
    background: var(--white); color: var(--navy);
    border: 2px solid var(--border); border-radius: 10px;
    padding: 12px 20px; font-size: 14px; font-weight: 600;
    cursor: pointer; font-family: inherit; transition: all .2s;
  }
  .btn-secondary:hover { border-color: var(--navy); }
  .btn-secondary:disabled { opacity: .35; cursor: not-allowed; }
  .hint-text { font-size: 13px; color: var(--gray); align-self: center; }

  /* RESULT SCREEN */
  .result-screen { display: none; }
  .result-screen.show { display: block; }
  .result-card {
    background: var(--white); border-radius: 16px;
    padding: 40px 32px; text-align: center;
    box-shadow: 0 4px 24px rgba(0,48,135,.08);
    border: 1px solid var(--border);
    margin: 16px 0;
  }
  .result-emoji { font-size: 60px; margin-bottom: 12px; }
  .result-grade { font-size: 28px; font-weight: 800; margin-bottom: 8px; }
  .result-sub { color: var(--gray); font-size: 15px; margin-bottom: 24px; }
  .score-ring {
    width: 120px; height: 120px; border-radius: 50%;
    border: 6px solid var(--blue);
    display: flex; align-items: center; justify-content: center;
    margin: 0 auto 24px; gap: 4px;
  }
  .score-num { font-size: 42px; font-weight: 800; }
  .score-den { font-size: 18px; color: var(--gray); }
  .review-dots {
    display: flex; flex-wrap: wrap; gap: 8px;
    justify-content: center; margin: 20px 0;
  }
  .review-dot {
    width: 36px; height: 36px; border-radius: 8px;
    display: flex; align-items: center; justify-content: center;
    font-size: 12px; font-weight: 700;
    border: 2px solid transparent; cursor: pointer;
  }
  .review-dot.ok  { background: var(--green-bg); color: var(--green); border-color: var(--green-bd); }
  .review-dot.err { background: var(--red-bg);   color: var(--red);   border-color: var(--red-bd); }

  /* QUIZ SCREEN */
  .quiz-screen { }
  .quiz-screen.hide { display: none; }

  @media (max-width: 600px) {
    .card { padding: 20px 16px; }
    .q-text { font-size: 15px; }
    .opt-text { font-size: 13px; }
    .btn-primary, .btn-secondary { padding: 10px 16px; font-size: 13px; }
  }
</style>
</head>
<body>

<div class="header">
  <div class="header-left">
    <span class="header-brand">AEON Vietnam</span>
    <span class="header-sub">HR Portal · HC Plan 2027</span>
  </div>
  <span class="header-score" id="hdr-score">Câu 1 / 25</span>
</div>

<div class="progress-wrap">
  <div class="progress-bar" id="prog-bar" style="width:4%"></div>
</div>

<div class="dot-nav" id="dot-nav"></div>

<div class="main">

  <!-- QUIZ SCREEN -->
  <div class="quiz-screen" id="quiz-screen">
    <div class="card" id="q-card">
      <div class="q-tag" id="q-tag">Câu 1</div>
      <div class="q-text" id="q-text"></div>
      <div class="options" id="q-options"></div>

      <div class="feedback" id="feedback">
        <div class="feedback-title" id="fb-title"></div>
        <div class="feedback-body" id="fb-body"></div>
      </div>

      <div class="actions">
        <button class="btn-secondary" id="btn-prev" onclick="navigate(-1)">← Câu trước</button>
        <span class="hint-text" id="hint-text">Chọn một đáp án để tiếp tục</span>
        <button class="btn-primary" id="btn-next" onclick="navigate(1)" style="display:none">Câu tiếp →</button>
        <button class="btn-primary" id="btn-finish" onclick="showResult()" style="display:none">Xem kết quả 🎯</button>
      </div>
    </div>
  </div>

  <!-- RESULT SCREEN -->
  <div class="result-screen" id="result-screen">
    <div class="result-card">
      <div class="result-emoji" id="res-emoji">🏆</div>
      <div class="result-grade" id="res-grade"></div>
      <div class="result-sub">Bài kiểm tra HC Plan 2027 · AEON Vietnam</div>
      <div class="score-ring">
        <span class="score-num" id="res-score"></span>
        <span class="score-den" id="res-den"></span>
      </div>
      <div style="color:#374151;font-weight:600;margin-bottom:12px;font-size:14px">Chi tiết từng câu:</div>
      <div class="review-dots" id="review-dots"></div>
      <button class="btn-primary" onclick="restart()" style="margin-top:20px">Làm lại bài test</button>
      <button class="btn-secondary" onclick="reviewWrong()" style="margin-top:10px;display:block;margin-left:auto;margin-right:auto" id="btn-review-wrong">Xem lại câu sai</button>
    </div>
  </div>

</div><!-- /main -->

<script>
const QUIZ = [{"id": "Q1", "question": "Theo HC Plan 2027, HOD muốn chấm dứt 01 position đang hiện hữu trong năm 2027 thì cần làm gì?", "options": [{"label": "A", "text": "Vào New Headcount → nhập số lượng = 0 cho vị trí cần chấm dứt", "correct": false}, {"label": "B", "text": "Vào Current Headcount → chọn vị trí/nhân viên → View/Edit → Action Type = Reduce → nhập Effective date có hiệu lực giảm", "correct": true}, {"label": "C", "text": "Vào phần Current Headcount, chọn vị trí và nhấn Delete để xoá thông tin", "correct": false}, {"label": "D", "text": "Chỉ cần báo HRBP qua email, không cần thao tác gì trên hệ thống", "correct": false}, {"label": "E", "text": "Cả B và C đều đúng", "correct": false}], "correct_idx": 1}, {"id": "Q2", "question": "Theo quy trình được khuyến nghị trong HC Plan 2027, HOD muốn thảo luận thêm về Headcount Planning thì nên liên hệ với ai và theo hình thức nào?", "options": [{"label": "A", "text": "Gửi email cho HRBP và c/c cho TA team", "correct": false}, {"label": "B", "text": "Gửi email cho HRBP và c/c cho SP", "correct": false}, {"label": "C", "text": "Gửi email hoặc trao đổi trực tiếp đến HRBP/ HR Store và đồng thời c/c cho SPvà cấp quản lý của mình", "correct": true}, {"label": "D", "text": "Gửi Staff Hotline để được hỗ trợ nhanh nhất", "correct": false}], "correct_idx": 2}, {"id": "Q3", "question": "Theo HC Plan 2027, HOD có thể thực hiện điều chỉnh Job Grade của các vị trí trong Headcount Planning không và các trường hợp nào được hỗ trợ?", "options": [{"label": "A", "text": "Promote (Not Replacement): vị trí G3 tăng lên G4 — bộ phận tăng số lượng G4 và giảm vị trí G3 (không tuyển người thay thế G3)", "correct": false}, {"label": "B", "text": "Promote (Replacement): vị trí G3 tăng lên G4 — bộ phận tăng số lượng G4 và vẫn giữ vị trí G3 (cần tuyển người thay thế G3)", "correct": false}, {"label": "C", "text": "Cả A & B đều SAI. Không thể điều chỉnh Job Grade của vị trí trong Headcount Planning", "correct": false}, {"label": "D", "text":  "text": "3 chức năng: Thiết lập ORG — lập kế hoạch OT (PHL, Normal và Weekend) — Headcount Plan từng tháng từ hiện tại đến các tháng trong tương lai", "correct": false}, {"label": "C", "text": "3 chức năng: Thiết lập ORG — lập kế hoạch OT (PHL và Normal) — Headcount Plan từng tháng từ hiện tại đến các tháng trong tương lai", "correct": false}, {"label": "D", "text": "3 chức năng: Thiết lập & điều chỉnh ORG — lập kế hoạch OT (PHL và Normal) — Headcount Plan từng tháng từ hiện tại đến các tháng trong tương lai", "correct": true}], "correct_idx": 3}, {"id": "Q25", "question": "HOD muốn giao cho nhân viên HR Store thực hiện HC Plan và cập nhật ORG thay mình. HOD cần truy cập vào đâu để thực hiện phân công?", "options": [{"label": "A", "text": "Menu > Settings > User Management > Assign Role", "correct": false}, {"label": "B", "text": "Menu > Recruitment > Headcount Plan → chuyển sang tab Assign Department → nhấn Assign → điền Department/Line, Assigned to, Effective date (bắt buộc), End date (không bắt buộc) → nhấn Assign để lưu", "correct": true}, {"label": "C", "text": "Menu > Settings > Organization → chọn phòng ban → Assign HR", "correct": false}, {"label": "D", "text": "Menu > Recruitment > Headcount Plan → nhấn Create Request → chọn người thực hiện thay", "correct": false}], "correct_idx": 1}];

let current = 0;
let answers = {}; // { qIndex: { chosen: optIdx, correct: bool } }
let reviewMode = false;
let wrongList = [];

function init() {
  buildDots();
  renderQ(0);
}

function buildDots() {
  const nav = document.getElementById('dot-nav');
  nav.innerHTML = '';
  QUIZ.forEach((q, i) => {
    const d = document.createElement('div');
    d.className = 'dot' + (i === current ? ' active' : '');
    d.textContent = i + 1;
    d.onclick = () => goTo(i);
    d.id = 'dot-' + i;
    nav.appendChild(d);
  });
}

function updateDot(i) {
  const d = document.getElementById('dot-' + i);
  if (!d) return;
  const ans = answers[i];
  d.className = 'dot answered' + (i === current ? ' active' : '')
    + (ans ? (ans.correct ? ' correct' : ' wrong') : '');
}

function goTo(i) {
  updateDot(current);
  current = i;
  renderQ(i);
  buildDots();
  updateDot(i);
}

function renderQ(i) {
  const q = QUIZ[i];
  const ans = answers[i];
  const answered = ans !== undefined;
  const total = QUIZ.length;

  document.getElementById('q-tag').textContent = 'Câu ' + (i + 1);
  document.getElementById('q-text').textContent = q.question;
  document.getElementById('hdr-score').textContent = 'Câu ' + (i+1) + ' / ' + total;
  document.getElementById('prog-bar').style.width = ((i+1)/total*100) + '%';

  // Options
  const opts = document.getElementById('q-options');
  opts.innerHTML = '';
  q.options.forEach((opt, oi) => {
    const btn = document.createElement('button');
    btn.className = 'opt-btn';
    if (answered) {
      if (opt.correct) btn.className += ' correct';
      else if (ans.chosen === oi && !opt.correct) btn.className += ' wrong';
      btn.disabled = true;
    } else {
      btn.onclick = () => selectOpt(i, oi);
    }

    const circle = document.createElement('span');
    circle.className = 'opt-circle';
    if (answered && opt.correct) circle.textContent = '✓';
    else if (answered && ans.chosen === oi && !opt.correct) circle.textContent = '✗';
    else circle.textContent = opt.label;

    const text = document.createElement('span');
    text.className = 'opt-text';
    text.textContent = opt.text;

    btn.appendChild(circle);
    btn.appendChild(text);
    opts.appendChild(btn);
  });

  // Feedback
  const fb = document.getElementById('feedback');
  const fbTitle = document.getElementById('fb-title');
  const fbBody  = document.getElementById('fb-body');
  if (answered) {
    fb.className = 'feedback show ' + (ans.correct ? 'ok' : 'err');
    const correctOpt = q.options.find(o => o.correct);
    if (ans.correct) {
      fbTitle.innerHTML = '✅ Chính xác!';
      fbBody.textContent = 'Bạn đã chọn đúng đáp án ' + correctOpt.label + '.';
    } else {
      const chosenOpt = q.options[ans.chosen];
      fbTitle.innerHTML = '💡 Đáp án đúng là: ' + correctOpt.label;
      fbBody.textContent = correctOpt.text;
    }
  } else {
    fb.className = 'feedback';
  }

  // Buttons
  const btnPrev   = document.getElementById('btn-prev');
  const btnNext   = document.getElementById('btn-next');
  const btnFinish = document.getElementById('btn-finish');
  const hint      = document.getElementById('hint-text');

  btnPrev.disabled = (i === 0);

  if (answered) {
    hint.style.display = 'none';
    if (i < total - 1) {
      btnNext.style.display = 'inline-block';
      btnFinish.style.display = 'none';
    } else {
      btnNext.style.display = 'none';
      btnFinish.style.display = 'inline-block';
    }
  } else {
    hint.style.display = 'inline';
    btnNext.style.display = 'none';
    btnFinish.style.display = 'none';
  }

  // Active dot
  document.querySelectorAll('.dot').forEach((d, di) => {
    d.classList.toggle('active', di === i);
  });
}

function selectOpt(qIdx, optIdx) {
  if (answers[qIdx] !== undefined) return;
  const q = QUIZ[qIdx];
  const correct = q.options[optIdx].correct;
  answers[qIdx] = { chosen: optIdx, correct };
  updateDot(qIdx);
  renderQ(qIdx);
}

function navigate(dir) {
  updateDot(current);
  current = Math.max(0, Math.min(QUIZ.length - 1, current + dir));
  renderQ(current);
}

function showResult() {
  document.getElementById('quiz-screen').classList.add('hide');
  document.getElementById('result-screen').classList.add('show');

  const total = QUIZ.length;
  const score = Object.values(answers).filter(a => a.correct).length;
  wrongList = Object.keys(answers).filter(k => !answers[k].correct).map(Number);

  let emoji, grade, color;
  if (score >= 23)     { emoji = '🏆'; grade = 'Xuất sắc';    color = '#15803d'; }
  else if (score >= 20){ emoji = '✅'; grade = 'Tốt';          color = '#1d4ed8'; }
  else if (score >= 15){ emoji = '📈'; grade = 'Khá';          color = '#b45309'; }
  else                  { emoji = '📚'; grade = 'Cần ôn lại';  color = '#b91c1c'; }

  document.getElementById('res-emoji').textContent = emoji;
  document.getElementById('res-grade').textContent = grade;
  document.getElementById('res-grade').style.color = color;
  document.getElementById('res-score').textContent = score;
  document.getElementById('res-score').style.color = color;
  document.getElementById('res-den').textContent  = '/' + total;
  document.getElementById('score-ring') && (document.querySelector('.score-ring').style.borderColor = color);

  const dots = document.getElementById('review-dots');
  dots.innerHTML = '';
  QUIZ.forEach((q, i) => {
    const ans = answers[i];
    const d = document.createElement('div');
    d.className = 'review-dot ' + (ans ? (ans.correct ? 'ok' : 'err') : 'err');
    d.textContent = i + 1;
    d.title = 'Câu ' + (i+1) + ': ' + (ans?.correct ? 'Đúng' : 'Sai');
    d.onclick = () => { reviewMode = true; goTo(i); showQuiz(); };
    dots.appendChild(d);
  });

  if (wrongList.length === 0) {
    document.getElementById('btn-review-wrong').style.display = 'none';
  }
}

function showQuiz() {
  document.getElementById('quiz-screen').classList.remove('hide');
  document.getElementById('result-screen').classList.remove('show');
}

function reviewWrong() {
  if (wrongList.length === 0) return;
  reviewMode = true;
  goTo(wrongList[0]);
  showQuiz();
}

function restart() {
  answers = {};
  current = 0;
  reviewMode = false;
  wrongList = [];
  buildDots();
  renderQ(0);
  showQuiz();
}

init();
</script>
</body>
</html>
